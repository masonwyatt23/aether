[package]
name = "aether-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
aether-ast.workspace = true
aether-parser.workspace = true
aether-types.workspace = true
thiserror.workspace = true
regex = "1"
sha2 = "0.10"
getrandom = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# On wasm32 (the browser playground), `getrandom` cannot source OS entropy and
# needs the `js` feature to use the Web Crypto API instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
