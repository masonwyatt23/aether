[workspace]
resolver = "2"
members = [
    "crates/aether-ast",
    "crates/aether-lexer",
    "crates/aether-parser",
    "crates/aether-types",
    "crates/aether-eval",
    "crates/aether-stdlib",
    "crates/aether-cli",
    "crates/aether-lsp",
    "crates/aether-bc",
    "crates/aether-tools-net",
    "crates/aether-wasm",
    "crates/aether-difftest",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masonwyatt/aether"
authors = ["Aether contributors"]
rust-version = "1.75"

[workspace.dependencies]
aether-ast = { path = "crates/aether-ast" }
aether-lexer = { path = "crates/aether-lexer" }
aether-parser = { path = "crates/aether-parser" }
aether-types = { path = "crates/aether-types" }
aether-eval = { path = "crates/aether-eval" }
aether-bc = { path = "crates/aether-bc" }
aether-stdlib = { path = "crates/aether-stdlib" }
aether-tools-net = { path = "crates/aether-tools-net" }
aether-wasm = { path = "crates/aether-wasm" }
aether-difftest = { path = "crates/aether-difftest" }

logos = "0.14"
ariadne = "0.4"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `from_str` / `from_iter` are deliberate inherent constructors on AST types
# (TyCon::from_str, EffectRow::from_iter, …) — not trait impls. This lint is
# in clippy's default `style` group, so `-A clippy::pedantic` alone won't
# silence it; allow it explicitly so CI's `-D warnings` stays green.
should_implement_trait = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
many_single_char_names = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
