name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.rust }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        rust: [stable, beta]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build aether-wasm
        run: cargo build -p aether-wasm --target wasm32-unknown-unknown

  vscode:
    name: VS Code extension typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-aether/package-lock.json

      - name: Install dependencies
        working-directory: vscode-aether
        run: npm install

      - name: TypeScript check
        working-directory: vscode-aether
        run: npx tsc --noEmit

  smt:
    name: SMT backend (z3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install z3
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Exercise the SMT escalation path
        # With z3 on PATH the z3-gated tests in the smt module run for real,
        # verifying the SMT-LIB2 translation and verdict parsing.
        run: "cargo test -p aether-types smt::tests"

  benchmark:
    name: verified-code benchmark self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-cargo-

      - name: Install z3
        # The expert tier has non-linear tasks that escalate to z3; without
        # it the baseline self-test (which must score 100%) would fail.
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Build the aether CLI
        run: cargo build --release -p aether-cli

      - name: Baseline self-test (every reference solution must verify)
        # run.py exits non-zero if any eval/baseline task fails to verify,
        # so a broken task or a harness regression fails CI.
        run: python3 eval/harness/run.py eval/baseline

      - name: Generator self-test (templates produce sound, non-trivial tasks)
        # gen_tasks.py --validate asserts every generated reference verifies
        # and every generated stub does not -- a broken template fails CI.
        run: >-
          python3 eval/harness/gen_tasks.py --seed 0 --per-family 3
          --out "$RUNNER_TEMP/ci-instances" --validate

      - name: Vendored env templates in sync
        # The RL environment vendors eval/templates.py so it is self-contained;
        # this guards against the two copies drifting apart.
        run: diff eval/templates.py environments/aether_verified_code/templates.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install z3
        # The SMT-escalation tests need z3; without it they self-skip and
        # that code path shows as uncovered.
        run: sudo apt-get update && sudo apt-get install -y z3

      # Measurement only — there is intentionally no coverage threshold gate.
      # A maintainer can add one later with `--fail-under-lines <N>`.
      - name: Measure coverage
        run: cargo llvm-cov --workspace --exclude aether-wasm --lcov --output-path lcov.info

      - name: Coverage summary
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
